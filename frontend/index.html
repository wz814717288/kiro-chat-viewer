<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiro Chat Viewer</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <button id="toggleSidebar" class="ghost icon-btn" title="Show / hide session list">☰</button>
    <div class="brand">Kiro Chat History</div>
    <div class="search">
      <input id="searchInput" type="text" placeholder="Full-text search… (Enter)" />
      <button id="searchBtn">Search</button>
      <button id="clearBtn" class="ghost">Clear</button>
    </div>
    <div class="actions">
      <span id="stats" class="stats"></span>
      <button id="profileBtn" class="ghost">🪞 Your Digital Profile</button>
      <button id="todosBtn" class="ghost">✅ Todos</button>
      <button id="dashBtn" class="ghost">📊 Stats</button>
      <button id="settingsBtn" class="ghost">⚙️ Settings</button>
      <button id="langBtn" class="ghost" title="中文 / English">中</button>
      <button id="reindexBtn" class="ghost">Reindex</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-head">
        <div class="sidebar-head-top">
          <span id="listTitle">Sessions</span>
          <button id="selectBtn" class="ghost mini-btn">Select</button>
        </div>
        <div class="filters">
          <select id="modelFilter"><option value="">All models</option></select>
          <select id="modeFilter"><option value="">All modes</option></select>
          <select id="sortSelect">
            <option value="modified_desc">Recently updated</option>
            <option value="created_desc">Recently created</option>
            <option value="messages_desc">Most messages</option>
            <option value="messages_asc">Fewest messages</option>
            <option value="title_asc">Title A-Z</option>
          </select>
        </div>
        <input id="wsFilter" type="text" placeholder="Filter by workspace…" />
      </div>
      <ul id="sessionList" class="session-list"></ul>
      <div id="pager" class="pager"></div>
      <div id="exportBar" class="export-bar" style="display:none">
        <div class="export-bar-row">
          <span id="exportCount" class="stats"></span>
          <label class="switch"><input type="checkbox" id="exportTools" /> <span id="exportToolsLabel">With tools</span></label>
        </div>
        <div class="export-bar-row">
          <button id="exportSelAll" class="ghost mini-btn">All</button>
          <button id="exportGo">Export</button>
          <button id="exportCancel" class="ghost mini-btn">Cancel</button>
        </div>
      </div>
    </aside>

    <section class="content">
      <!-- 会话详情视图 -->
      <div id="detailView" class="detail">
        <div class="placeholder">Pick a session on the left, or search above.</div>
      </div>

      <!-- 统计仪表盘视图 -->
      <div id="dashView" class="dashboard" style="display:none"></div>

      <!-- 待办视图 -->
      <div id="todosView" class="dashboard" style="display:none"></div>

      <!-- Kiro 眼中的你 视图 -->
      <div id="profileView" class="dashboard" style="display:none"></div>

      <!-- 设置视图 -->
      <div id="settingsView" class="dashboard" style="display:none"></div>
    </section>
  </main>

  <script src="/static/i18n.js"></script>
  <script src="/static/markdown.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
